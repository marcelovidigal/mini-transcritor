# Integração contínua: roda os testes a cada push em dev/main e a cada PR para a main. NÃO gera release.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: FedericoCarboni/setup-ffmpeg@v3   # os testes geram mídia sintética com ffmpeg
        if: runner.os != 'macOS'   # esta ação só suporta x64; o runner macOS é arm64
      - name: ffmpeg no macOS (Homebrew)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  docker-build:   # valida que a imagem do servidor compila (não publica nada; a publicação é do release.yml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
