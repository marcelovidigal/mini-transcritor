<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 760" width="980" height="760" role="img" aria-labelledby="t d">
  <title id="t">Proposta multiagente "Qualidade" do Mini Transcritor</title>
  <desc id="d">Pipeline: preparo, geração por dois modelos do Ollama, portão de divergência, revisor com áudio, juiz, especialistas e regras de legenda, com a pasta de trabalho dos fragmentos ao lado.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#475569"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .code { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; }
      .agent { fill: #ecfdf5; stroke: #10b981; stroke-width: 2; }
      .gen { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.5; }
      .opt { fill: #ffffff; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .store { fill: #f1f5f9; stroke: #64748b; stroke-width: 1.5; }
      .ln { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
      .lnd { stroke: #64748b; stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; marker-end: url(#arr); }
      .t { font: 600 14px system-ui, "Segoe UI", sans-serif; fill: #0f172a; }
      .s { font: 12px system-ui, "Segoe UI", sans-serif; fill: #334155; }
      .h { font: 700 15px system-ui, "Segoe UI", sans-serif; fill: #0f172a; }
      .lg { font: 12px system-ui, "Segoe UI", sans-serif; fill: #334155; }
    </style>
  </defs>
  <rect class="bg" width="980" height="760"/>
  <text x="24" y="34" class="h">Opção "Qualidade": pipeline multiagente (ADK orquestra; o Ollama é o backend)</text>

  <!-- 1. entrada e preparo -->
  <rect class="box" x="24" y="56" width="170" height="56" rx="10"/>
  <text x="109" y="80" class="t" text-anchor="middle">Áudio / vídeo</text>
  <text x="109" y="98" class="s" text-anchor="middle">arquivo do usuário</text>
  <path class="ln" d="M194 84 H236"/>
  <rect class="code" x="238" y="56" width="400" height="56" rx="10"/>
  <text x="438" y="78" class="t" text-anchor="middle">1 · Preparo (código)</text>
  <text x="438" y="98" class="s" text-anchor="middle">extrair áudio · VAD · fragmentos de fala · manifesto</text>
  <path class="ln" d="M638 84 H690"/>
  <rect class="store" x="690" y="56" width="266" height="76" rx="10"/>
  <text x="823" y="78" class="t" text-anchor="middle">Pasta de trabalho work/&lt;id&gt;/</text>
  <text x="823" y="97" class="s" text-anchor="middle">0000.wav, 0001.wav … + manifesto.json</text>
  <text x="823" y="115" class="s" text-anchor="middle">apagada só quando o job conclui ou dá erro</text>

  <!-- 2. geração -->
  <path class="ln" d="M438 112 V150"/>
  <rect x="24" y="152" width="640" height="132" rx="12" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="40" y="172" class="h">2 · Geração (ParallelAgent no ADK; executada em fases na GPU única)</text>
  <rect class="gen" x="40" y="184" width="190" height="86" rx="10"/>
  <text x="135" y="208" class="t" text-anchor="middle">Gerador A</text>
  <text x="135" y="228" class="s" text-anchor="middle">modelo de áudio do Ollama</text>
  <text x="135" y="246" class="s" text-anchor="middle">ex.: gemma4:e4b</text>
  <text x="135" y="262" class="s" text-anchor="middle">→ state["hip_a"]</text>
  <rect class="gen" x="246" y="184" width="190" height="86" rx="10"/>
  <text x="341" y="208" class="t" text-anchor="middle">Gerador B</text>
  <text x="341" y="228" class="s" text-anchor="middle">outro modelo do Ollama</text>
  <text x="341" y="246" class="s" text-anchor="middle">(família diferente)</text>
  <text x="341" y="262" class="s" text-anchor="middle">→ state["hip_b"]</text>
  <rect class="opt" x="452" y="184" width="196" height="86" rx="10"/>
  <text x="550" y="208" class="t" text-anchor="middle">Gerador C (opcional)</text>
  <text x="550" y="228" class="s" text-anchor="middle">Whisper (motor alternativo)</text>
  <text x="550" y="246" class="s" text-anchor="middle">só se a medição justificar</text>
  <text x="550" y="262" class="s" text-anchor="middle">→ state["hip_c"]</text>
  <path class="lnd" d="M690 132 V168 H664"/>
  <text x="700" y="160" class="s">lê os fragmentos</text>

  <!-- 3. portão -->
  <path class="ln" d="M344 284 V322"/>
  <rect class="code" x="124" y="324" width="440" height="62" rx="10"/>
  <text x="344" y="348" class="t" text-anchor="middle">3 · Portão de divergência (código, sem modelo)</text>
  <text x="344" y="368" class="s" text-anchor="middle">WER entre hipóteses + sinais do quality.py (alucinação, velocidade, idioma)</text>
  <path class="ln" d="M564 355 H650"/>
  <rect class="box" x="652" y="324" width="304" height="62" rx="10"/>
  <text x="804" y="348" class="t" text-anchor="middle">concordam → aceita a geração A</text>
  <text x="804" y="368" class="s" text-anchor="middle">(só o que diverge ou é suspeito segue)</text>

  <!-- 4. revisor e juiz -->
  <path class="ln" d="M344 386 V424"/>
  <text x="352" y="410" class="s">divergentes</text>
  <rect class="agent" x="24" y="426" width="420" height="104" rx="12"/>
  <text x="234" y="450" class="t" text-anchor="middle">4 · Revisor (agente) — modelo de áudio</text>
  <text x="234" y="470" class="s" text-anchor="middle">reouve o fragmento pela ferramenta ouvir_fragmento</text>
  <text x="234" y="488" class="s" text-anchor="middle">compara A e B e devolve JSON: veredito (A/B/mescla),</text>
  <text x="234" y="506" class="s" text-anchor="middle">texto proposto, evidência, confiança  → state["revisao"]</text>
  <path class="ln" d="M444 478 H492"/>
  <rect class="agent" x="494" y="426" width="462" height="104" rx="12"/>
  <text x="725" y="450" class="t" text-anchor="middle">5 · Juiz / consolidador (agente)</text>
  <text x="725" y="470" class="s" text-anchor="middle">aplica o veredito só com travas: mudança pequena, evidência,</text>
  <text x="725" y="488" class="s" text-anchor="middle">confiança mínima, palavras vindas de A, B ou do glossário;</text>
  <text x="725" y="506" class="s" text-anchor="middle">na dúvida, mantém a geração prioritária → state["final"]</text>

  <!-- aceitos vão direto ao juiz/final -->
  <path class="lnd" d="M804 386 V424"/>
  <text x="812" y="410" class="s">aceitos</text>

  <!-- 6. especialistas -->
  <path class="ln" d="M600 530 V568"/>
  <rect class="agent" x="24" y="570" width="640" height="76" rx="12"/>
  <text x="344" y="594" class="t" text-anchor="middle">6 · Especialistas (SequentialAgent)</text>
  <text x="344" y="614" class="s" text-anchor="middle">termos e nomes (glossário) → pontuação e segmentação → revisão da tradução</text>
  <text x="344" y="632" class="s" text-anchor="middle">cada um com uma tarefa estreita e medida isoladamente</text>
  <path class="ln" d="M664 608 H700"/>
  <rect class="code" x="702" y="570" width="254" height="76" rx="12"/>
  <text x="829" y="594" class="t" text-anchor="middle">7 · Regras de legenda (código)</text>
  <text x="829" y="614" class="s" text-anchor="middle">42 caracteres · 2 linhas · 17 cps</text>
  <text x="829" y="632" class="s" text-anchor="middle">→ SRT + relatório de qualidade</text>

  <!-- legenda -->
  <rect x="24" y="672" width="932" height="68" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <rect class="code" x="40" y="688" width="22" height="14" rx="3"/><text x="70" y="700" class="lg">código determinístico</text>
  <rect class="gen" x="230" y="688" width="22" height="14" rx="3"/><text x="260" y="700" class="lg">geração (modelo do Ollama)</text>
  <rect class="agent" x="450" y="688" width="22" height="14" rx="3"/><text x="480" y="700" class="lg">agente (ADK) com papel de revisão</text>
  <rect class="opt" x="700" y="688" width="22" height="14" rx="3"/><text x="730" y="700" class="lg">opcional</text>
  <text x="40" y="727" class="lg">Todas as chamadas ao Ollama usam o OllamaClient do projeto (áudio e texto). O LiteLLM não é usado.</text>
</svg>
